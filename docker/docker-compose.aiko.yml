# Aiko-specific overrides for self-hosted Supabase.
# Activated via COMPOSE_FILE in .env (docker-compose.yml:docker-compose.aiko.yml).
services:
  supavisor:
    ports: !override
      # Host 5432 is commonly occupied by another local Postgres. Keep Supabase
      # internals on db:5432, but expose pooler session mode on host 5433.
      - 5433:5432
      - ${POOLER_PROXY_PORT_TRANSACTION}:6543

  functions:
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        cp /certs/cloudflare-gateway.pem /usr/local/share/ca-certificates/cloudflare-gateway.crt
        update-ca-certificates
        exec edge-runtime start --main-service /home/deno/functions/main
    volumes:
      # Trust the local TLS inspection root when fetching Deno imports.
      - ./.certs/cloudflare-gateway.pem:/certs/cloudflare-gateway.pem:ro
      # Serve the app's Edge Function from the repo instead of copying it.
      - ../supabase/functions/aiko-chat:/home/deno/functions/aiko-chat:z
    environment:
      DENO_CERT: /certs/cloudflare-gateway.pem
      DENO_TLS_CA_STORE: system
      # aiko-chat secrets (see CLAUDE.md — AI provider + LINE bot). Set in docker/.env.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
