name: CI

# Every push runs the quality gates. Other branches also get a Firebase Hosting
# preview channel right away; `main` deploys Firebase rules and the live site
# only after the gates pass. One-time setup: docs/deployment.md.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a production deploy halfway; newer main runs queue instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  app:
    name: Flutter checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze lib test
      - name: Test
        run: flutter test

  backend:
    name: Firebase rules and functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            firebase/functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm --prefix firebase/functions ci
      - name: Functions unit tests
        run: npm --prefix firebase/functions test
      - name: Emulator tests (rules, storage, functions)
        run: |
          cp firebase/functions/.secret.local.example firebase/functions/.secret.local
          npx firebase emulators:exec --project demo-aiko --only auth,firestore,storage,functions "npm run test:rules"
      # Node only (no Flutter build, a few seconds); deploy-web.yml runs them
      # again before writing a build's precache. Reported even when the steps
      # above fail.
      - name: Service worker tests
        if: ${{ !cancelled() }}
        run: npm run test:web

  docs:
    name: Docs links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check links, anchors and file paths in docs
        run: npm run docs:check

  preview:
    name: Preview
    # Hosting jobs, like `firebase`, wait for FIREBASE_PROJECT_ID; until it is
    # set, CI skips deploys instead of failing (see docs/deployment.md).
    if: github.ref != 'refs/heads/main' && vars.FIREBASE_PROJECT_ID != ''
    uses: ./.github/workflows/deploy-web.yml
    with:
      target: preview
    secrets: inherit
    permissions:
      contents: read
      statuses: write

  firebase:
    name: Firebase deploy
    if: github.ref == 'refs/heads/main' && vars.FIREBASE_PROJECT_ID != ''
    needs: [app, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      # Comma-separated firebase.json targets. Add `storage` and `functions`
      # once the project is on the Blaze plan (see docs/deployment.md). Hosting
      # is deployed by deploy-web.yml, which builds the app.
      FIREBASE_DEPLOY_ONLY: ${{ vars.FIREBASE_DEPLOY_ONLY || 'firestore' }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing repository secret FIREBASE_SERVICE_ACCOUNT. See docs/deployment.md."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            firebase/functions/package-lock.json
      - run: npm ci
      - run: npm --prefix firebase/functions ci
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy
        run: |
          functions=() others=()
          IFS=, read -ra targets <<< "${FIREBASE_DEPLOY_ONLY// /}"
          for target in "${targets[@]}"; do
            case "$target" in
              '') ;;
              functions|functions:*) functions+=("$target") ;;
              hosting|hosting:*) echo "::warning::Skipping '$target': deploy-web.yml deploys Hosting." ;;
              *) others+=("$target") ;;
            esac
          done
          deploy() {
            npx firebase deploy --project "$FIREBASE_PROJECT_ID" --non-interactive "$@"
          }
          # Without --force, indexes created outside this repo are kept.
          if [ ${#others[@]} -gt 0 ]; then
            deploy --only "$(IFS=,; echo "${others[*]}")"
          fi
          # Functions need --force in CI to set the Artifact Registry cleanup
          # policy and to remove functions deleted from the `aiko` codebase.
          if [ ${#functions[@]} -gt 0 ]; then
            deploy --only "$(IFS=,; echo "${functions[*]}")" --force
          fi

  production:
    name: Production
    needs: [app, backend, firebase]
    # `firebase` and this job are skipped until FIREBASE_PROJECT_ID is set.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      vars.FIREBASE_PROJECT_ID != '' &&
      needs.app.result == 'success' && needs.backend.result == 'success' &&
      needs.firebase.result != 'failure'
    uses: ./.github/workflows/deploy-web.yml
    with:
      target: production
    secrets: inherit
    permissions:
      contents: read
      statuses: write
